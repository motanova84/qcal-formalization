name: QCAL Ω Audit

on:
  push:
    paths:
      - 'ledger/**'
      - 'scripts/validate_omega_ledger.py'
      - 'QCAL/**'
      - 'QCAL_V3/**'
      - 'proofs/**'
  pull_request:
    paths:
      - 'ledger/**'
      - 'scripts/validate_omega_ledger.py'
      - 'QCAL/**'
      - 'QCAL_V3/**'
      - 'proofs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omega-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ledger schema and inheritance
        run: python3 scripts/validate_omega_ledger.py ledger/omega.json
      - name: Install Lean toolchain
        uses: leanprover/lean4-action@v1
        with:
          lake-package-directory: .
      - name: Build Lean formalization
        run: lake build
