name: QCAL Ω Audit

on:
  push:
    paths:
      - 'ledger/**'
      - 'AUDIT/**'
      - 'tests/test_audit_ledger.py'
      - 'scripts/validate_omega_ledger.py'
      - 'QCAL/**'
      - 'QCAL_V3/**'
      - 'proofs/**'
  pull_request:
    paths:
      - 'ledger/**'
      - 'AUDIT/**'
      - 'tests/test_audit_ledger.py'
      - 'scripts/validate_omega_ledger.py'
      - 'QCAL/**'
      - 'QCAL_V3/**'
      - 'proofs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omega-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical QCAL Ω ledger
        run: python3 -m pytest tests/test_audit_ledger.py -q
      - name: Validate legacy ledger schema
        run: python3 scripts/validate_omega_ledger.py ledger/omega.json
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean formalization
        run: lake build
